[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localcloud"
version = "0.1.0"
description = "Personal E2EE cloud storage server + client"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "quart>=0.19,<1.0",
    "hypercorn>=0.17,<1.0",
    "PyNaCl>=1.5,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "cbor2>=5.6,<7.0",
    "httpx>=0.27,<1.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.5",
    "pylint>=3.0",
    "pyright>=1.1.350",
    "pip-audit>=2.7",
    "hypothesis>=6.100",
]

[project.scripts]
localcloud = "client.cli:main"
localcloud-server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "server*", "shared*"]
exclude = ["tests*", "rust*"]

# ──────────────────────────── Tool config ────────────────────────────

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["client", "server", "shared"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Conservative ruleset focused on correctness, not style noise. Black/isort
# handle formatting; pylint handles deeper analysis.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear (common pitfalls)
    "UP",  # pyupgrade
    "SIM", # simplify
    "RET", # return statements
    "S",   # security (bandit-like)
]
ignore = [
    "E501",  # line length — Black handles
    "S101",  # assert used — fine in tests / preconditions
    "S104",  # hardcoded-bind — server validates bind_host itself
    "SIM108", # ternary suggestions are often less clear
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]

[tool.pylint.main]
ignore-paths = ["rust/", "build/", "dist/"]
# CI gate: pylint exits non-zero below this score. The remaining ~9.8
# delta is intentional-pattern noise (mutable module singletons named
# lowercase, callback signatures with interface-mandated unused args, the
# module-init `global` pattern, exception-body `pass`, intentional adjacent
# string literals) plus the Phase 3 complexity items disabled below.
# Phase 3 (ARCH-H3) cleanup will let this ratchet upward — never lower it.
fail-under = 9.8

[tool.pylint.format]
# Match black; the actual line-length enforcement lives with ruff/black
# (line-too-long is disabled below), but keep pylint's notion consistent.
max-line-length = 88

[tool.pylint.typecheck]
# keycore is a compiled Rust extension (maturin) that pylint's static
# analyzer cannot import to introspect; its members (KeyPair,
# verify_signature) exist at runtime and are exercised by the test suite.
ignored-modules = ["keycore"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
    "line-too-long",  # Black handles
    "duplicate-code",  # too noisy across small modules
    "fixme",  # explicit policy: no TODOs in delivered code, but we audit those separately
    "import-outside-toplevel",
    "broad-exception-caught",
    # ── Complexity checks deferred to Phase 3 (ARCH-H3) ──
    # ARCH-H3 will decompose the known god-functions/modules (server
    # storage/auth/database). Until then these would fail CI on code we
    # have already scheduled for restructuring; they are NOT permanently
    # waived — re-enable as ARCH-H3 lands and raise fail-under accordingly.
    "too-many-return-statements",   # R0911 — storage/auth dispatch funcs
    "too-many-positional-arguments",  # R0917 — wide ctor/seal signatures
    "too-many-public-methods",      # R0904 — Database facade (Phase 3 split)
    "too-many-lines",               # C0302 — storage.py (1377 LOC)
]

[tool.pyright]
include = ["client", "server", "shared"]
exclude = ["rust/**", "**/__pycache__", "**/.venv", "**/target"]
# Point pyright at the project virtualenv so it resolves third-party
# stubs (quart, cbor2, argon2, nacl) and loads click's real types
# instead of treating decorated functions as bare FunctionType.
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
