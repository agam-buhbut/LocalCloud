# /etc/systemd/journald.conf.d/localcloud.conf
#
# Minimal, security-events-only logging policy (README.txt PART II §1):
# connections, auth failures, quota events, backup events — and NO plaintext
# metadata. The application already logs generically (no filenames, no user
# content); this constrains journald so logs stay small, volatile-leaning, and
# don't accumulate sensitive breadcrumbs.
#
# After installing: systemctl restart systemd-journald

[Journal]
# Keep logs in memory + a small persistent cap. On an encrypted disk this is
# fine; lower Storage=volatile if you want logs gone on every reboot.
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=2week
# Rate-limit log floods (e.g. a scan hammering the WG port pre-firewall).
RateLimitIntervalSec=30s
RateLimitBurst=1000
# Do not forward to syslog/console/wall — single sink, less exposure.
ForwardToSyslog=no
ForwardToWall=no
