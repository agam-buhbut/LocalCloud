name: CI

# Runs the full project toolchain. Merges are gated on every job/step
# passing. The exact commands here mirror what is run locally and were
# verified green before this workflow was committed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # keycore is a Rust extension built with maturin; the Python suite
      # imports it, so the Rust toolchain must be present in this job too.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (keycore build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The committed uv.lock is the reproducible-env source of truth. Fail the
      # build if it has drifted from pyproject.toml (run `uv lock` to refresh).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # Build ./.venv from uv.lock, so every check below (pip-audit included)
      # runs on the exact locked versions. maturin is a build tool, not a
      # project dependency, so it is added to the venv on its own (unpinned).
      - name: Install project (dev extras) from uv.lock + maturin
        run: |
          uv sync --locked --extra dev
          uv pip install maturin

      # maturin develop refuses to run outside a virtualenv; `uv run` points
      # it at ./.venv. --no-sync (here and below) uses the venv exactly as
      # built above: uv must not re-resolve or change it.
      - name: Build keycore extension
        run: uv run --no-sync maturin develop --release -m rust/keycore/Cargo.toml

      # Fail fast if the native extension didn't actually build/import. The
      # suite uses importorskip("keycore"), so without this guard a broken
      # build would SILENTLY skip every real-crypto test and still go green.
      - name: Verify keycore imports (no silent skip)
        run: uv run --no-sync python -c "import keycore; assert hasattr(keycore, 'KeyPair')"

      - name: black (format check)
        run: uv run --no-sync black --check .

      - name: isort (import order check)
        run: uv run --no-sync isort --check --profile black .

      - name: ruff (lint)
        run: uv run --no-sync ruff check .

      - name: pylint
        run: uv run --no-sync pylint client server shared

      - name: pyright (type check)
        run: uv run --no-sync pyright

      # Coverage is measured + gated (COV-1). The floor is a ratchet set just
      # below the current ~84% TOTAL — raise it as coverage improves, never
      # lower it. term-missing surfaces the uncovered lines in the log.
      - name: pytest (with coverage gate)
        run: >-
          uv run --no-sync pytest -q
          --cov=client --cov=server --cov=shared
          --cov-report=term-missing --cov-fail-under=82

      - name: pip-audit (Python supply chain)
        run: uv run --no-sync pip-audit

      # SBOM is inventory, not a merge gate (pip-audit/cargo-audit are the
      # gate). continue-on-error so a CLI quirk never blocks a merge; the
      # CycloneDX JSON is uploaded for release records. cyclonedx-bom goes
      # into the runner's Python, not the venv, and describes ./.venv.
      - name: Generate Python SBOM (CycloneDX)
        continue-on-error: true
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment .venv -o sbom-python.json
      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.json
          if-no-files-found: ignore

  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # rust/ is one Cargo workspace (keycore-core, keycore, keycore-mobile)
      # with a single Cargo.lock. Each check below covers all three crates.
      - name: rustfmt (format check)
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (Rust supply chain)
        run: cargo audit --file rust/Cargo.lock

      # SBOM is inventory, not a gate (see the Python job). Non-blocking.
      - name: Generate Rust SBOM (CycloneDX)
        continue-on-error: true
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path rust/Cargo.toml --format json
      - name: Upload Rust SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-rust
          path: rust/**/*.cdx.json
          if-no-files-found: ignore
