[package]
name = "keycore"
version = "0.1.0"
edition = "2021"
description = "Secure key management for LocalCloud — PyO3 desktop extension over keycore-core"

[lib]
name = "keycore"
crate-type = ["cdylib"]

[dependencies]
# Shared pure-Rust crypto core. All crypto primitives now live there;
# this crate is a thin PyO3 skin and pulls them in transitively.
keycore-core = { path = "../keycore-core" }

# pyo3 >=0.29 clears RUSTSEC-2026-0176 (OOB read in PyList/PyTuple
# iterators) and RUSTSEC-2026-0177 (missing Sync bound on
# PyCFunction::new_closure). API-compatible with our usage: the modern
# Bound API (PyBytes::new, Bound<'py>), #[pyclass], #[pyfunction].
pyo3 = { version = "0.29", features = ["extension-module"] }

# NOTE: the release profile lives at the workspace root (rust/Cargo.toml);
# Cargo ignores `[profile.*]` in non-root members.
